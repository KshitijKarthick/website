worker_processes  auto;

error_log  /usr/share/nginx/logs/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /usr/share/nginx/logs/access.log  main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/font-woff2;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Cache static assets aggressively, revalidate HTML and JSON
        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.json$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        location ~* \.(png|jpg|jpeg|webp|gif|ico|svg|woff2|woff)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.pdf$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # HTML — never cache; always fetch fresh so versioned asset URLs are current
        location / {
            try_files $uri $uri/ =404;
            expires -1;
            add_header Cache-Control      "no-cache, no-store, must-revalidate";
            add_header X-Frame-Options        "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            add_header Referrer-Policy        "strict-origin-when-cross-origin";
        }
    }
}
