version: '3'
services:
  website_http_server:
    networks:
      - web
    build: .
    image: website
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.http-server-website.rule=Host(`kshitijkarthick.me`) || Host(`kshitij.cc`) || Host(`www.kshitijkarthick.me`) || Host(`www.kshitij.cc`)"
      - "traefik.http.routers.http-server-website.tls=true"
      - "traefik.http.routers.http-server-website.entrypoints=websecure"
      - "traefik.http.routers.http-server-website.tls.certresolver=myresolver"
      - "traefik.http.routers.http-server-website.tls.domains[0].main=kshitijkarthick.me"
      - "traefik.http.routers.http-server-website.tls.domains[0].sans=*.kshitijkarthick.me"
      - "traefik.http.routers.http-server-website.tls.domains[1].main=kshitij.cc"
      - "traefik.http.routers.http-server-website.tls.domains[1].sans=*.kshitij.cc"
    volumes:
      - "${PWD}/server/nginx.conf:/etc/nginx/nginx.conf"
      - "${PWD}/server/logs/:/usr/share/nginx/logs/"
networks:
  web:
    external: true
